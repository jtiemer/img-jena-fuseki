name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: write
  packages: write

jobs:
  test-gate:
    name: Test and Validate Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Commitizen & Pre-commit
        run: |
          pip install commitizen pre-commit

      - name: Run Pre-commit Checks (Syntax & Linters)
        run: |
          pre-commit run --all-files

      - name: Run Smoke Tests (Blocking)
        run: |
          bash tests/smoke_test.sh

      - name: Build Image
        run: |
          # Build the image using the build script
          bash scripts/build-image.sh

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fuseki:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Integration Tests (Blocking)
        run: |
          # Run the integration tests
          bash tests/integration_test.sh
  dev-release:
    name: Dev Release Tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag Release (if version was bumped)
        run: bash scripts/tag-release.sh

      - name: Build Dev Image
        run: |
          # Build the image; build-image.sh will automatically resolve the tag to: <version>-dev
          bash scripts/build-image.sh

  main-release:
    name: Main Release Tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag Release (if version was bumped)
        run: bash scripts/tag-release.sh

      - name: Build Production Image
        run: |
          # Build the image; build-image.sh will automatically resolve the tag to: <version>
          bash scripts/build-image.sh
