name: CI/CD Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: write
  packages: write

jobs:
  test-gate:
    name: Test and Validate Gate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      ENGINE: docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Commitizen & Pre-commit
        run: |
          pip install commitizen pre-commit

      - name: Install Tooling (Hadolint & Trivy)
        run: |
          sudo curl -sSfL "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64" -o /usr/local/bin/hadolint
          sudo chmod +x /usr/local/bin/hadolint
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Cache Pre-commit Environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run Pre-commit Checks (Syntax & Linters)
        run: |
          pre-commit run --all-files

      - name: Run Smoke Tests (Blocking)
        run: |
          bash tests/smoke_test.sh
      - name: Build Image
        run: |
          # Build the image using the build script
          bash scripts/build-image.sh

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fuseki:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Integration Tests (Blocking)
        run: |
          # Run the integration tests
          bash tests/integration_test.sh

  validate-source-branch:
    name: Validate Merge Source Branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check head branch is allowed to merge into base branch
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          case "$BASE" in
            main)
              if [[ ! "$HEAD" =~ ^(feat|bugfix|fix|chore|refactor|docs|style|perf|test|ci|build|dependabot|release)/.+ ]]; then
                echo "ERROR: PRs into 'main' must originate from a conventional branch (got '$HEAD')." >&2
                exit 1
              fi
              ;;
            *)
              echo "Target branch '$BASE' has no source-branch restriction."
              ;;
          esac
  main-release:
    name: Main Release Tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag Release (if version was bumped)
        run: bash scripts/tag-release.sh

      - name: Build Production Image
        run: |
          bash scripts/build-image.sh --release
