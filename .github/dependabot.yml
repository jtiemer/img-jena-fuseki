version: 2
updates:
  # Maintain GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain OpenTofu/Terraform modules and provider pins
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
