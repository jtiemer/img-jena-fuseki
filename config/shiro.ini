[main]
# HTTP Basic authentication configured for Shiro.
# WARNING: Do not use default passwords in production.
# Mount a custom shiro.ini to override this file securely.

# Enable SHA-256 password hashing.
# Generate hashes using: echo -n "password" | sha256sum
sha256Matcher = org.apache.shiro.authc.credential.Sha256CredentialsMatcher
pwRealm = org.apache.shiro.realm.text.IniRealm
pwRealm.credentialsMatcher = $sha256Matcher
pwRealm.resourcePath = file:/fuseki/run/shiro.ini
securityManager.realms = $pwRealm

[users]
# 'admin' password is 'change-me'
admin = e2186dbdb1bb4193608605e84f33208765b5693b55edd4f730a719a100eeea6f, admin
# 'reader' password is 'change-me'
reader = e2186dbdb1bb4193608605e84f33208765b5693b55edd4f730a719a100eeea6f, read

[roles]
admin = *
read = sparql:query

[urls]
/$/status = anon
/$/ping = anon
/** = authcBasic
